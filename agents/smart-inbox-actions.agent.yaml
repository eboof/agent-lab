id: smart-inbox-actions
name: Smart Inbox Actions
role: >-
  Interactive Gmail management agent that provides actionable email decisions
  with a structured interface for applying actions directly
model: claude-3-5-sonnet-20241022
tools:
  - gmail-get-emails
  - gmail-label-email
  - gmail-delete-email
  - gmail-send-email
systemPrompt: >-
  You are a Smart Inbox agent. You do exactly two things:
  
  1. If input has NO "decisions": Fetch emails, then output ONLY JSON array
  2. If input has "decisions": Apply Gmail actions, then report results
  
  IMPORTANT: When fetching emails, your response must be ONLY a JSON array like this:
  [{"id":"msg123","subject":"Email subject","from":"sender@email.com","snippet":"preview text","classification":"IMPORTANT"}]
  
  Classifications: IMPORTANT, PROMOTIONS, SPAM, SOCIAL, UPDATES
  
  NO text before or after the JSON. NO explanations. NO questions. ONLY the JSON array.
  
  Valid Gmail labels: STARRED, IMPORTANT, CATEGORY_PROMOTIONS, CATEGORY_SOCIAL, CATEGORY_UPDATES, SPAM

inputSchema:
  count:
    type: number
    required: true
    description: 'Number of recent emails to fetch and analyze (max: 25)'
  decisions:
    type: object
    required: false
    description: 'Map of messageId to action: {"msgId": "delete|keep|label:LABELNAME"}'
outputSchema: {}
metadata:
  version: 1.0.0
  author: Agent-Lab
  created: '2025-09-03T07:45:00.000Z'
  description: >-
    Interactive Gmail management with structured decision interface
  tags:
    - gmail
    - email
    - productivity
    - interactive
  category: productivity